<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />

    <title>SOPA — creative and technology agency</title>
    <meta
      name="description"
      content="A creative and technology agency: strategy, design, marketing and engineering on one team. From idea to something testable in hours, and live the same day."
    />
    <link rel="canonical" href="https://sopa.team/en/" />

    <!-- Par de hreflang: as duas locales se apontam, e `x-default` manda quem
         não bate com nenhuma para o português. Vale nas duas páginas — cada uma
         lista as duas, ou o Google ignora o par inteiro. -->
    <link rel="alternate" hreflang="pt-BR" href="https://sopa.team/" />
    <link rel="alternate" hreflang="en" href="https://sopa.team/en/" />
    <link rel="alternate" hreflang="x-default" href="https://sopa.team/" />

    <!-- Preview de link (WhatsApp, LinkedIn, Slack). Esses robôs não executam
         JavaScript: o que eles mostram sai daqui, não da página renderizada.

         A imagem é um print da home — a palavra, o feixe e as estrelas, sem o
         resto da interface. JPEG e não PNG: o mesmo quadro em PNG dá 428 KB, e
         o WhatsApp costuma desistir do preview acima de uns 300 KB. Aqui são
         75 KB, e num quadro que é quase todo degradê escuro o JPEG não deixa
         banda visível — o grão do shader ajuda. Para refazer, ver o README. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SOPA" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="pt_BR" />
    <meta property="og:url" content="https://sopa.team/en/" />
    <meta property="og:title" content="SOPA — creative and technology agency" />
    <meta
      property="og:description"
      content="Strategy, design, marketing and engineering on one team. From idea to something testable in hours, and live the same day."
    />
    <meta property="og:image" content="https://sopa.team/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="SOPA — creative and technology agency" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SOPA",
        "alternateName": "Sopa Agency",
        "url": "https://sopa.team/en/",
        "logo": "https://sopa.team/og.jpg",
        "description": "A creative and technology agency: strategy, design, marketing and engineering on one team.",
        "areaServed": "Worldwide",
        "sameAs": [
          "https://www.linkedin.com/company/sopa-agency/",
          "https://x.com/sopa_agency"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

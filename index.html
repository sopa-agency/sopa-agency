<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />

    <!-- Só a marca, de propósito: é o que aparece na aba, e ali o espaço é de
         uns 20 caracteres antes de cortar. O preço é o headline do resultado de
         busca, que perde as palavras-chave — elas ficam na `description`, no
         JSON-LD e no `og:title` logo abaixo, que é o que o preview de link usa.
         Alongar este tag para agradar buscador estraga a aba; a aba é o que o
         cliente vê todo dia. -->
    <title>SOPA</title>
    <meta
      name="description"
      content="Agência de criação e tecnologia: estratégia, design, marketing e engenharia na mesma panela. Da ideia a algo testável em poucas horas, e no ar no mesmo dia."
    />
    <link rel="canonical" href="https://sopa.team/" />

    <!-- Par de hreflang: as duas locales se apontam, e `x-default` manda quem
         não bate com nenhuma para o português. Vale nas duas páginas — cada uma
         lista as duas, ou o Google ignora o par inteiro. -->
    <link rel="alternate" hreflang="pt-BR" href="https://sopa.team/" />
    <link rel="alternate" hreflang="en" href="https://sopa.team/en/" />
    <link rel="alternate" hreflang="x-default" href="https://sopa.team/" />

    <!-- Preview de link (WhatsApp, LinkedIn, Slack). Esses robôs não executam
         JavaScript: o que eles mostram sai daqui, não da página renderizada.

         A imagem é um print da home — a palavra, o feixe e as estrelas, sem o
         resto da interface. JPEG e não PNG: o mesmo quadro em PNG dá 428 KB, e
         o WhatsApp costuma desistir do preview acima de uns 300 KB. Aqui são
         75 KB, e num quadro que é quase todo degradê escuro o JPEG não deixa
         banda visível — o grão do shader ajuda. Para refazer, ver o README. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SOPA" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:url" content="https://sopa.team/" />
    <meta property="og:title" content="SOPA — agência de criação e tecnologia" />
    <meta
      property="og:description"
      content="Estratégia, design, marketing e engenharia na mesma panela. Da ideia a algo testável em poucas horas, e no ar no mesmo dia."
    />
    <meta property="og:image" content="https://sopa.team/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="SOPA — agência de criação e tecnologia" />
    <meta name="twitter:card" content="summary_large_image" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "SOPA",
        "alternateName": "Sopa Agency",
        "url": "https://sopa.team/",
        "logo": "https://sopa.team/logo.png",
        "description": "Agência de criação e tecnologia: estratégia, design, marketing e engenharia na mesma equipe.",
        "areaServed": "Worldwide",
        "sameAs": [
          "https://www.linkedin.com/company/sopa-agency/",
          "https://x.com/sopa_agency"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
